{% extends 'base.html' %}

{% block title %}Register — SkillSwap{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="navbar-brand-logo justify-content-center mb-2">
                        <div class="logo-icon">
                            <i data-lucide="repeat" style="width: 20px; height: 20px;"></i>
                        </div>
                        <span>SkillSwap</span>
                    </div>
                    <h3 class="fw-bold">Create Your Student Account</h3>
                    <p class="text-muted small">Start sharing what you know and learn what you want with peers</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="full_name" class="form-label small fw-semibold">Full Name *</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Alex Rivera" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label small fw-semibold">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="alex@university.edu" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="institution" class="form-label small fw-semibold">College / Institution *</label>
                            <input type="text" class="form-control" id="institution" name="institution" placeholder="e.g. Stanford University" required>
                        </div>
                        <div class="col-md-6">
                            <label for="education_level" class="form-label small fw-semibold">Education Level *</label>
                            <select class="form-select" id="education_level" name="education_level">
                                <option value="Undergraduate (Year 1)">Undergraduate (Year 1)</option>
                                <option value="Undergraduate (Year 2)" selected>Undergraduate (Year 2)</option>
                                <option value="Undergraduate (Year 3)">Undergraduate (Year 3)</option>
                                <option value="Undergraduate (Year 4)">Undergraduate (Year 4)</option>
                                <option value="Postgraduate / Master's">Postgraduate / Master's</option>
                                <option value="High School Senior">High School Senior</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label small fw-semibold">Password *</label>
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0" id="password" name="password" placeholder="At least 6 chars" required minlength="6">
                                <button class="btn btn-light border border-start-0 password-toggle-btn" type="button" data-target="password">
                                    <i data-lucide="eye" style="width: 16px;"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label small fw-semibold">Confirm Password *</label>
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0" id="confirm_password" name="confirm_password" placeholder="Re-type password" required minlength="6">
                                <button class="btn btn-light border border-start-0 password-toggle-btn" type="button" data-target="confirm_password">
                                    <i data-lucide="eye" style="width: 16px;"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                        <label class="form-check-label small text-muted" for="terms">
                            I accept the <a href="{{ url_for('main.about') }}">Terms of Service</a> and acknowledge the SkillSwap Student Code of Conduct.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 mb-3">
                        Register & Begin Onboarding
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="small text-muted mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="fw-semibold">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
