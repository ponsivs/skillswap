services:
  - type: web
    name: skillswap
    env: python
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString

databases:
  - name: skillswap-db
    databaseName: skillswap
    user: skillswap_user
    plan: free
